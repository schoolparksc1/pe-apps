<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스포츠 토너먼트</title>
<meta name="description" content="반 대항 토너먼트 대진표·추첨·경기 기록·순위. 기록은 이 기기에만 저장됩니다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}
.boot{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-3);font-size:15px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E9EFF6; --ink:#14203A; --ink-2:#48566F; --ink-3:#7A879E;
  --line:#D5DEEA; --line-strong:#B7C4D6;
  --blue:#1D58B3; --blue-soft:#E0EAF9; --orange:#E26A12; --orange-soft:#FCE9DA;
  --rose:#BD2358; --rose-soft:#FAE2EA; --green:#23803A; --green-soft:#E0F2E4; --danger:#C22A2A; --danger-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 6px 18px rgba(20,32,58,.06);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1220; --surface:#141D2E; --surface-2:#1B263C; --ink:#E6ECF6; --ink-2:#A8B5CA; --ink-3:#74839E;
    --line:#26344F; --line-strong:#374868;
    --blue:#6FA1F1; --blue-soft:#1A2B4B; --orange:#F59A45; --orange-soft:#3A2614;
    --rose:#F06A98; --rose-soft:#3A1727; --green:#5EC479; --green-soft:#142E1C; --danger:#F07171; --danger-soft:#3A1818;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1220; --surface:#141D2E; --surface-2:#1B263C; --ink:#E6ECF6; --ink-2:#A8B5CA; --ink-3:#74839E;
  --line:#26344F; --line-strong:#374868;
  --blue:#6FA1F1; --blue-soft:#1A2B4B; --orange:#F59A45; --orange-soft:#3A2614;
  --rose:#F06A98; --rose-soft:#3A1727; --green:#5EC479; --green-soft:#142E1C; --danger:#F07171; --danger-soft:#3A1818;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1080px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;letter-spacing:.01em}
.brand h1 span{color:var(--blue)}
.meta{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;font-weight:600;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--orange)}
.tab.admin{color:var(--orange)}
.stripe{height:4px;background:linear-gradient(90deg,var(--blue) 0 62%,var(--orange) 62% 80%,var(--green) 80%)}
.teacher-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.mode-btns{display:inline-flex;gap:6px;flex-wrap:nowrap}
.rec-btn[aria-pressed="true"]{background:var(--green)!important;border-color:var(--green)!important;color:#fff}
.teacher-btn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:22px 48px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700}
.sub{color:var(--ink-2);font-size:14px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ev-bm-m{--ev:var(--blue);--ev-soft:var(--blue-soft)}
.ev-bm-f{--ev:var(--rose);--ev-soft:var(--rose-soft)}
.ev-tt{--ev:var(--green);--ev-soft:var(--green-soft)}
.chip.ev{background:var(--ev-soft);color:var(--ev)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.pill.done{background:var(--surface-2);color:var(--ink-2);border-color:transparent}
.pill.ready{color:var(--blue);border-color:var(--blue)}
.pill.partial{background:var(--orange-soft);color:var(--orange);border-color:transparent}
.pill.wait{color:var(--ink-3);border-style:dashed}

/* segmented */
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg3{display:flex;flex-wrap:nowrap;align-self:flex-start;max-width:100%}
.seg3 button{white-space:nowrap}
@media (max-width:640px){ .seg3{align-self:stretch} .seg3 button{flex:1 1 0;min-width:0;padding:8px 4px;font-size:13px;text-align:center;letter-spacing:-.02em} }
@media (max-width:640px){ section > .spread{flex-direction:column;align-items:flex-start;gap:2px} }
@media (max-width:359px){ .seg3 button{font-size:11.5px;padding:8px 2px;letter-spacing:-.04em} }
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- match cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:var(--shadow);border-top:4px solid var(--ev)}
.mcard:hover{border-color:var(--line-strong);border-top-color:var(--ev)}
.mcard .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard .when{font-size:13px;color:var(--ink-2)}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{font-size:18px;font-weight:700;line-height:1.2}
.team.b{text-align:right}
.team small{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.team.win{color:var(--orange)}
.team.tbd{color:var(--ink-3);font-weight:500;font-size:15px}
.score{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.score .sep{color:var(--ink-3);padding-inline:4px}
.vs{font-family:var(--f-display);font-size:18px;color:var(--ink-3)}

.banner{border-radius:12px;padding:16px 18px;background:var(--blue-soft);color:var(--ink);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dday{font-family:var(--f-display);font-size:36px;line-height:1;color:var(--blue)}
.dd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dd-item{display:flex;gap:12px;align-items:flex-start;background:var(--blue-soft);border-radius:12px;padding:14px 16px}
.dd-d{font-family:var(--f-display);font-size:28px;line-height:1.1;color:var(--blue);white-space:nowrap;flex:none;min-width:3.2em;font-variant-numeric:tabular-nums}
.dd-b{display:flex;flex-direction:column;gap:2px;min-width:0;word-break:keep-all}
.dd-b b{font-size:16px}
.dd-when{font-weight:700;color:var(--ink)}
.dd-where{font-size:13px;color:var(--ink-2)}
.dd-note{font-size:12px;color:var(--ink-3)}
.dd-l{flex:none;display:flex;flex-direction:column;gap:6px}
.cd{display:flex;flex-direction:column;gap:1px}
.cd-k{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.cd-v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;color:var(--orange);white-space:pre;line-height:1.35}
.ro-banner{display:flex;flex-direction:column;gap:2px;background:var(--orange-soft);border:1px solid var(--orange);border-radius:12px;padding:12px 16px;font-size:14px}
.ro-banner b{color:var(--orange)}
.dd-grid.one{grid-template-columns:minmax(0,520px)}
.dd-go{align-self:flex-start;margin-top:8px;padding:7px 14px;font-size:13px}
.dd-item.today{background:var(--orange-soft)}
.dd-apply:not(.done) .dd-b b,.dd-apply:not(.done) .dd-when,.dd-apply:not(.done) .cd-v{color:var(--danger)}
.dd-apply:not(.done) .dd-b b{font-weight:800}
.dd-item.today .dd-d{color:var(--orange)}
.dd-item.done{background:var(--surface-2)}
.dd-item.done .dd-d{color:var(--ink-3);font-size:24px}
@media (max-width:900px){ .dd-grid{grid-template-columns:1fr} .dd-item{padding:12px 14px} }

/* notices */
.notices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.notices li{display:grid;grid-template-columns:84px 1fr auto;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:start}
.notices time{font-size:13px;color:var(--ink-3)}
.notices p{margin:0;white-space:pre-wrap}
.nbtns{display:flex;gap:6px}
.icon-btn.edit{color:var(--blue)}
.edited{font-size:12px;color:var(--ink-3)}
.nedit{display:flex;flex-direction:column;gap:8px}
.nedit textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:14px;resize:vertical}
.nedit-date{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.notices li.editing{grid-template-columns:84px 1fr}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--danger)}

/* ---------- schedule list ---------- */
.day{display:flex;flex-direction:column}
.day-h{font-weight:700;font-size:14px;color:var(--ink-2);padding:10px 2px 6px;display:flex;gap:8px;align-items:center}
.day-h.today{color:var(--orange)}
.day-h.today::after{content:"오늘";font-size:11px;background:var(--orange);color:#fff;border-radius:4px;padding:1px 6px}
.mrow{display:grid;grid-template-columns:56px 118px 96px 1fr auto;gap:12px;align-items:center;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-bottom:0;text-align:left;width:100%}
.day .mrow:first-of-type{border-radius:10px 10px 0 0}
.day .mrow:last-child{border-bottom:1px solid var(--line);border-radius:0 0 10px 10px}
.day .mrow:only-of-type{border-radius:10px}
.mrow:hover{background:var(--surface-2)}
.mrow .t{font-family:var(--f-num);font-size:13px;color:var(--ink-2)}
.mrow .rd{font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.25}
.mrow .rd .after{font-size:11px;font-weight:500;line-height:1.2}
.mrow .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.mrow .line .w{color:var(--orange)}
.mrow .line .sc{font-family:var(--f-num);font-size:14px;color:var(--ink-2);font-weight:500}
.mrow .line .tbd{color:var(--ink-3);font-weight:500}

/* ---------- bracket ---------- */
.bracket-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.bracket{display:block}
.bracket.fit{width:100%;height:auto}
.bracket-wrap.fit{padding:6px}
.rseg{display:flex}
.rseg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.rseg button small{font-size:11px;font-weight:500;color:var(--ink-3);font-family:var(--f-num)}
.rcards{display:flex;flex-direction:column;gap:10px}
.rcard{width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--ev);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.rc-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.rc-h b{color:var(--ink);font-size:15px;margin-right:auto}
.rc-t{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.rc-t .nm{font-weight:700;font-size:17px;line-height:1.3}
.rc-t .og{font-size:12px;color:var(--ink-3)}
.rc-t .sc{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.rc-t.win{background:var(--orange-soft)}
.rc-t.win .nm,.rc-t.win .sc{color:var(--orange)}
.rc-t.lose .nm,.rc-t.lose .sc{color:var(--ink-3)}
.rc-t.tbd .nm{color:var(--ink-3);font-weight:500;font-size:15px}
.wtag{display:inline-block;font-size:11px;background:var(--orange);color:var(--surface);border-radius:4px;padding:1px 6px;vertical-align:2px}
.rc-f{font-size:12px;color:var(--ink-3)}
.champ-banner{background:var(--orange);color:var(--surface);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column}
.champ-banner span{font-size:12px;font-weight:600;opacity:.9}
.champ-banner b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2}
.champ-banner small{font-size:12px;opacity:.9}
.swipe-hint{display:none;margin:0;font-size:12px;color:var(--ink-3)}
@media (max-width:1100px){ .swipe-hint{display:block} }
.bracket .edge{fill:none;stroke:var(--line-strong);stroke-width:1.5}
.bracket .edge.hot{stroke:var(--orange);stroke-width:3}
.bracket .leaf rect{fill:var(--surface-2);stroke:var(--line)}
.bracket .leaf .slot{fill:var(--ev);font-weight:700;font-size:12px}
.bracket .leaf .slotbg{fill:var(--ev-soft);stroke:none}
.bracket .leaf .nm{fill:var(--ink);font-weight:700;font-size:14px}
.bracket .leaf.out .nm{fill:var(--ink-3);font-weight:500;text-decoration:line-through}
.bracket .node{cursor:pointer}
.bracket .node rect{fill:var(--surface);stroke:var(--line-strong)}
.bracket .node:hover rect,.bracket .node:focus rect{stroke:var(--blue);stroke-width:2}
.bracket .node .lb{fill:var(--ink-3);font-size:11px}
.bracket .node .val{fill:var(--ink);font-weight:700;font-size:13px}
.bracket .node .val.vs2{font-size:12px;letter-spacing:-.01em}
.bracket .node .val.tbd{fill:var(--ink-3);font-weight:500}
.bracket .node .sc{fill:var(--ink-2);font-family:var(--f-num);font-size:11px}
.bracket .node.done rect{fill:var(--orange-soft);stroke:var(--orange)}
.bracket .champ rect{fill:var(--orange);stroke:none}
.bracket .champ .lb{fill:#fff;font-size:11px;font-weight:600;opacity:.9}
.bracket .champ .val{fill:#fff;font-size:17px;font-weight:700}
.bracket .champ.tbd rect{fill:var(--surface-2);stroke:var(--line-strong);stroke-dasharray:4 3}
.bracket .champ.tbd .lb,.bracket .champ.tbd .val{fill:var(--ink-3)}
.bracket .colh{fill:var(--ink-3);font-size:12px;font-weight:600}
.bracket text{font-family:var(--f-body)}

/* ---------- ranking ---------- */
.podiums{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.podium{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--ev)}
.podium ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.podium li{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.podium li .rk{font-family:var(--f-display);font-size:18px}
.podium li.r1{background:var(--orange-soft)}
.podium li.r1 .rk{color:var(--orange)}
.podium li .cls{font-weight:700;font-size:17px}
.podium li .cls.tbd{color:var(--ink-3);font-weight:500;font-size:14px}
.podium li .how{font-size:12px;color:var(--ink-3);text-align:right}

/* ---------- rules ---------- */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rules .panel h3{margin-bottom:8px}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rules li{max-width:62ch}
.rulebook{display:flex;flex-direction:column;gap:4px;padding:20px 22px}
.rulebook h3{font-size:18px;margin-bottom:4px;color:var(--ev)}
.rb-note{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.rb-h{margin:18px 0 6px;font-size:15px;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rulebook .fact + .rb-h,.rulebook .rb-note + .rb-h,.rulebook h3 + .rb-h{margin-top:6px}
.rb{display:grid;grid-template-columns:2.2em 1fr;gap:2px;max-width:72ch;line-height:1.6}
.rb-1{padding-left:.4em;margin-top:4px}
.rb-2{padding-left:2.6em;color:var(--ink-2);font-size:14.5px}
.rb-mk{font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rb-1 .rb-mk{color:var(--ev)}
@media (max-width:640px){ .rulebook{padding:16px} .rb-2{padding-left:1.6em} }
.fact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 8px;max-width:520px}
.fact div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.fact b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.fact span{font-size:12px;color:var(--ink-2)}

/* ---------- modal / score sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.sheet-h{padding:16px 18px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.sheet-h h2{font-family:var(--f-display);font-weight:400;font-size:24px}
.close{border:0;background:var(--surface-2);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.pw-sheet{max-width:380px;margin-top:10vh}
.sheet-b{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.form-meta{display:grid;grid-template-columns:auto 1fr auto 1fr;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;font-size:14px}
.form-meta > *{padding:8px 10px;border-right:1px solid var(--line-strong)}
.form-meta > *:last-child{border-right:0}
.form-meta .k{background:var(--blue-soft);font-weight:700;text-align:center;white-space:nowrap}
.rec-wrap{overflow-x:auto}

<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ============================================================
   스포츠 토너먼트 (범용 배포판) — 모든 기록은 이 기기(브라우저)에만 저장
   만든 이: 다정고 박성찬
   ============================================================ */
var LS = 'pe-tournament-v1', APP_VER = '1.1';
var WD = ['일','월','화','수','목','금','토'];
var COLORS = ['파랑','분홍','초록','주황'];
var RN = {32:'32강',16:'16강',8:'8강',4:'4강',2:'결승'}, RID = {32:'R32',16:'R16',8:'QF',4:'SF',2:'F'};
var ROUNDS = ['32강','16강','8강','4강','결승'];
var PAIR_ORDER = {1:[0],2:[0,1],4:[0,3,1,2],8:[0,7,3,4,1,6,2,5]};
var MAX_TEAMS = 32;

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function isNum(v){ return typeof v === 'number' && isFinite(v); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function dObj(s){ return new Date(s + 'T00:00:00'); }
function addDays(s, n){ var d = dObj(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b){ return Math.round((dObj(b) - dObj(a)) / 86400000); }
function fmtDate(s, long){ if (!s) return '날짜 미정'; var d = dObj(s); return (d.getMonth()+1) + (long ? '월 ' : '/') + d.getDate() + (long ? '일' : '') + ' (' + WD[d.getDay()] + ')'; }
function fmtStamp(iso){ if (!iso) return ''; var d = new Date(iso); return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function slotL(i){ var A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; return i < 26 ? A[i] : A[Math.floor(i/26)-1] + A[i%26]; }

/* ---------------- 저장 ---------------- */
function blankState(){
  return { v:1, title:'', org:'', place:'체육관', timeNote:'점심시간', events:[], draws:{}, results:{}, moved:{},
    notices:[], milestones:[], rules:'', refs:{ on:true, list:[], assign:{} }, updatedAt:null };
}
function fixState(s){
  var b = blankState();
  if (!s || typeof s !== 'object') return b;
  for (var k in b) if (!(k in s)) s[k] = b[k];
  if (!Array.isArray(s.events)) s.events = [];
  s.events.forEach(function(e){
    if (!Array.isArray(e.teams)) e.teams = [];
    if (!Array.isArray(e.games) || !e.games.length) e.games = ['1세트','2세트','3세트'];
    if (!Array.isArray(e.dates)) e.dates = [];
    if (e.mode !== 'sum') e.mode = 'set';
    if (!(e.perDay >= 1)) e.perDay = 1;
    if (!isNum(e.target)) e.target = 21;
    if (!(e.color >= 0)) e.color = 0;
    if (!e.time) e.time = '12:35';
    e.deuce = !!e.deuce; e.split = !!e.split;
  });
  /* 예전 '대진 공유' 종목 → 남·녀부 나누기로 바꿈 */
  s.events.slice().forEach(function(e){
    if (!e.share) return;
    var b = s.events.filter(function(x){ return x.id === e.share; })[0];
    if (b){ b.split = true; Object.keys(s.results).forEach(function(k){ if (k.indexOf(e.id + ':') === 0){ s.results[b.id + '~f:' + k.slice(e.id.length + 1)] = s.results[k]; delete s.results[k]; } }); }
    s.events = s.events.filter(function(x){ return x !== e; });
  });
  s.events.forEach(function(e){ delete e.share; delete e.color; });
  if (!s.refs || typeof s.refs !== 'object') s.refs = b.refs;
  if (!Array.isArray(s.refs.list)) s.refs.list = [];
  if (!s.refs.assign) s.refs.assign = {};
  return s;
}
var DB = { state: blankState(), pin:'', kiosk:false, lastBackup:0, ui:{} };
try {
  var raw = localStorage.getItem(LS);
  if (raw){ var p = JSON.parse(raw); if (p && p.state){ DB = p; DB.state = fixState(p.state); DB.ui = DB.ui || {}; } }
} catch(e){}
var state = DB.state;
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(DB)); return true; } catch(e){ toast('저장하지 못했습니다. 브라우저 저장 공간을 확인하세요.'); return false; } }
function save(){ state.updatedAt = new Date().toISOString(); _mcache = {}; _evc = null; saveLocal(); }
function setState(s){ DB.state = state = fixState(s); _mcache = {}; _evc = null; }

/* ---------------- 종목·팀 ---------------- */
/* 화면에서 쓰는 종목 목록: 남·녀부로 나눈 종목은 두 개로 펼친다(대진은 같고 결과는 따로) */
var _evc = null;
function autoShort(n){ return String(n || '').replace(/^\s*\d+\s*학년\s*/, '').replace(/\s*남학생부$/, ' 남').replace(/\s*여학생부$/, ' 여').trim() || n; }
function evList(){
  if (_evc) return _evc;
  var out = [];
  state.events.forEach(function(b){
    function v(id, name, extra){ var o = Object.create(b); o.id = id; o.name = name; o.base = b; o.color = out.length % 4; o.short = autoShort(name); for (var k in extra) o[k] = extra[k]; out.push(o); }
    if (b.split){ v(b.id, b.name + ' 남학생부', { div:'m' }); v(b.id + '~f', b.name + ' 여학생부', { div:'f', share: b.id, teams: [] }); }
    else v(b.id, b.name, {});
  });
  return (_evc = out);
}
function EV(id){ var l = evList(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
function rawEV(id){ for (var i = 0; i < state.events.length; i++) if (state.events[i].id === id) return state.events[i]; return null; }
function owner(e){ if (typeof e === 'string') e = EV(e); if (e && e.share){ var o = EV(e.share); if (o && !o.share) return o; } return e; }
function teamsOf(e){ var o = owner(e); return o ? o.teams : []; }
function drawOf(e){ var o = owner(e); if (!state.draws[o.id]) state.draws[o.id] = { at:null, slots:{} }; return state.draws[o.id]; }
function teamName(e, tid){
  if (tid == null) return null; if (tid === 0) return '빈 자리';
  var ts = teamsOf(e); for (var i = 0; i < ts.length; i++) if (ts[i].id === tid) return ts[i].name;
  return '(삭제된 팀)';
}
/* 대진표 칸처럼 좁은 곳: 모든 팀 이름에 공통으로 붙은 앞말(예: '1학년 ')을 떼고 보여 준다 */
function shortName(e, tid){
  var full = teamName(e, tid); if (tid == null || tid === 0) return full;
  var ts = teamsOf(e).map(function(t){ return t.name; }); if (ts.length < 2) return full;
  var first = ts[0].split(' ')[0] + ' ';
  if (ts[0].indexOf(' ') > 0 && ts.every(function(n){ return n.indexOf(first) === 0 && n.length > first.length; })) return full.slice(first.length);
  return full;
}
function nTeams(e){ return Math.max(2, Math.min(MAX_TEAMS, teamsOf(e).length)); }
function letters(e){ var a = []; for (var i = 0; i < nTeams(e); i++) a.push(slotL(i)); return a; }
function drawDone(e){ var sl = drawOf(e).slots; return teamsOf(e).length >= 2 && letters(e).every(function(l){ return sl[l] != null; }); }

/* ---------------- 대진 엔진 ----------------
   팀 수(N) 이상인 가장 작은 2의 거듭제곱(P)으로 첫 라운드를 잡고, 첫 라운드 경기 수 = N − P/2.
   나머지 팀은 다음 라운드에 바로 올라간다(부전승). 예) 12팀 → 16강 4경기 + 8팀 8강 직행 */
function S(l){ return { s:l }; }
function W(id){ return { w:id }; }
function buildMatches(N, dates, perDay){
  var P = 2; while (P < N) P *= 2;
  var half = P / 2, k = N - half, fed = [], i;
  for (i = 0; i < half; i++) fed.push(false);
  if (half === 1) fed[0] = true;
  else {
    var po = PAIR_ORDER[half / 2]; if (!po){ po = []; for (i = 0; i < half / 2; i++) po.push(i); }
    var seq = po.map(function(x){ return 2 * x + 1; }).concat(po.map(function(x){ return 2 * x; }));
    for (i = 0; i < k; i++) fed[seq[i]] = true;
  }
  var li = 0, ms = [], cnt = {};
  function mk(size, a, b){ var n = size === 2 ? 0 : (cnt[size] = (cnt[size] || 0) + 1); var m = { id: size === 2 ? 'F' : RID[size] + '-' + n, r: RN[size], n:n, a:a, b:b }; ms.push(m); return W(m.id); }
  var nodes = fed.map(function(f){ if (f){ var a = S(slotL(li++)), b = S(slotL(li++)); return mk(P, a, b); } return S(slotL(li++)); });
  var size = half;
  while (nodes.length > 1){ var nx = []; for (i = 0; i < nodes.length; i += 2) nx.push(mk(size, nodes[i], nodes[i+1])); nodes = nx; size /= 2; }
  ms.sort(function(x, y){ return ROUNDS.indexOf(x.r) - ROUNDS.indexOf(y.r) || x.n - y.n; });
  var ds = (dates || []).slice().sort(), per = Math.max(1, perDay || 1);
  ms.forEach(function(m, j){ m.d = ds.length ? ds[Math.min(Math.floor(j / per), ds.length - 1)] : ''; });
  return ms;
}
var _mcache = {};
function matchesOf(e){
  if (typeof e === 'string') e = EV(e);
  var key = e.id + '|' + nTeams(e) + '|' + (e.dates || []).join(',') + '|' + e.perDay;
  return _mcache[key] || (_mcache[key] = buildMatches(nTeams(e), e.dates, e.perDay));
}
function needDays(e){ return Math.ceil(matchesOf(e).length / Math.max(1, e.perDay)); }
function evRounds(e){ var ms = matchesOf(e); return ROUNDS.filter(function(r){ return ms.some(function(m){ return m.r === r; }); }); }
function colOf(e, r){ return ROUNDS.indexOf(r) - ROUNDS.indexOf(evRounds(e)[0]) + 1; }
function getMatch(e, id){ var ms = matchesOf(e); for (var i = 0; i < ms.length; i++) if (ms[i].id === id) return ms[i]; return null; }
function roundName(m){ return m.r === '결승' ? '결승' : m.r + ' ' + m.n + '경기'; }
function moveOf(e, m){ return state.moved[e.id + ':' + m.id] || null; }
function mDate(e, m){ var o = moveOf(e, m); return (o && o.d) || m.d; }
function mTime(e, m){ var o = moveOf(e, m); return (o && o.t) || e.time; }

/* ---------------- 승패 판정 ----------------
   세트승(기본): 과반 세트를 먼저 이긴 팀 승. 세트 수가 같으면 총득점 → 운영진 판정
   총득점 합산: 모든 경기 득점 합 → 동점이면 세트 승수 → 운영진 판정 */
function evaluate(games, forfeit, override, nGames, mode){
  var tA = 0, tB = 0, wA = 0, wB = 0, entered = 0;
  for (var i = 0; i < nGames; i++){
    var g = games[i] || [];
    if (isNum(g[0]) && isNum(g[1])){ entered++; tA += g[0]; tB += g[1]; if (g[0] > g[1]) wA++; else if (g[1] > g[0]) wB++; }
  }
  var need = Math.floor(nGames / 2) + 1, winner = null, how = '', tie = false, complete = false;
  if (forfeit === 'a' || forfeit === 'b'){ winner = forfeit === 'a' ? 'b' : 'a'; how = '기권승'; complete = true; }
  else if (mode === 'sum'){
    if (entered === nGames){
      complete = true;
      if (tA !== tB){ winner = tA > tB ? 'a' : 'b'; how = '총득점'; }
      else if (wA !== wB){ winner = wA > wB ? 'a' : 'b'; how = '총득점 동점 · 세트 승수'; }
      else { tie = true; if (override === 'a' || override === 'b'){ winner = override; how = '운영진 판정'; } }
    }
  } else {
    if (wA >= need || wB >= need){ complete = true; winner = wA > wB ? 'a' : 'b'; how = '세트'; }
    else if (entered === nGames){
      complete = true;
      if (wA !== wB){ winner = wA > wB ? 'a' : 'b'; how = '세트'; }
      else if (tA !== tB){ winner = tA > tB ? 'a' : 'b'; how = '세트 동률 · 총득점'; }
      else { tie = true; if (override === 'a' || override === 'b'){ winner = override; how = '운영진 판정'; } }
    }
  }
  return { tA:tA, tB:tB, wA:wA, wB:wB, entered:entered, complete:complete, winner:winner, how:how, tie:tie };
}
function result(e, id){
  if (typeof e === 'string') e = EV(e);
  var m = getMatch(e, id), key = e.id + ':' + id, rec = state.results[key] || null;
  var A = teamOf(e, m.a), B = teamOf(e, m.b);
  var ev = evaluate(rec ? rec.games || [] : [], rec && rec.forfeit, rec && rec.override, e.games.length, e.mode);
  var winnerTeam = null, loserTeam = null, win = null;
  var bye = A != null && B != null && (A === 0 || B === 0);
  if (bye){ winnerTeam = A === 0 ? B : A; win = (A === 0 && B === 0) ? null : (A === 0 ? 'b' : 'a'); }
  else if (rec && ev.winner && A != null && B != null){ winnerTeam = ev.winner === 'a' ? A : B; loserTeam = ev.winner === 'a' ? B : A; win = ev.winner; }
  var status = 'wait';
  if (A != null && B != null) status = winnerTeam != null ? 'done' : (rec && ev.entered > 0 ? 'partial' : 'ready');
  return Object.assign(ev, { e:e, m:m, key:key, rec: bye ? null : rec, A:A, B:B, winnerTeam:winnerTeam, loserTeam:loserTeam, status:status, winner:win, bye:bye,
    how: bye ? '부전승' : ev.how, d: mDate(e, m), t: mTime(e, m), moved: !!moveOf(e, m) });
}
function teamOf(e, side){
  if (side.s){ var v = drawOf(e).slots[side.s]; return v == null ? null : v; }
  return result(e, side.w).winnerTeam;
}
function sideTbd(e, side){ return side.s ? side.s + ' 자리' : roundName(getMatch(e, side.w)) + ' 승자'; }

function bracketSvg(e){

  function colX(c){ return LEFT + LBW + 22 + (c - 1) * COLW; }
  function walk(side){
    if (side.s){ var i = leaves.length; leaves.push(side.s); pos['L:' + side.s] = { x:LEFT, y:TOP + i * ROW + ROW / 2, leaf:true }; return pos['L:' + side.s]; }
    var m = getMatch(e, side.w), pa = walk(m.a), pb = walk(m.b);
    var p = { x: colX(colOf(e, m.r)), y: (pa.y + pb.y) / 2, m:m }; pos['M:' + m.id] = p; return p;
  }
  var root = walk({ w:'F' }), RS = evRounds(e), champ = { x: colX(RS.length + 1), y: root.y };

    c.toBlob(function(b){ var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = (e.name + ' 대진표 ' + stamp() + '.png').replace(/[\\/:*?"<>|]/g, ' '); document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('대진표 이미지를 저장했습니다'); });
  };
  img.onerror = function(){ toast('이미지를 만들지 못했습니다. 인쇄 기능을 써 주세요.'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}

/* ---------------- 대화 상자 ---------------- */
function modalBox(html){ var host = document.getElementById('modal'); host.innerHTML = '<div class="scrim" data-act="box-cancel"><div class="sheet pw-sheet" role="dialog" aria-modal="true"><div class="sheet-b">' + html + '</div></div></div>'; }
var boxResolve = null;
function confirmBox(msg, ok){ return new Promise(function(res){ boxResolve = res; modalBox('<p style="margin:0 0 14px;line-height:1.6">' + esc(msg) + '</p><div class="actions"><button class="btn" data-act="box-cancel">취소</button><button class="btn primary" data-act="box-ok">' + esc(ok || '확인') + '</button></div>'); var b = document.querySelector('[data-act="box-ok"]'); if (b) b.focus(); }); }
function inputBox(msg, ok, ph){ return new Promise(function(res){ boxResolve = res; modalBox('<p style="margin:0 0 12px;line-height:1.6">' + esc(msg) + '</p><input type="password" id="box-in" placeholder="' + esc(ph || '') + '" style="width:100%;font-size:20px;text-align:center;margin-bottom:14px" autocomplete="off"><div class="actions"><button class="btn" data-act="box-cancel">취소</button><button class="btn primary" data-act="box-ok">' + esc(ok || '확인') + '</button></div>'); setTimeout(function(){ var i = document.getElementById('box-in'); if (i) i.focus(); }, 30); }); }
function alertBox(msg){ boxResolve = null; modalBox('<p style="margin:0 0 14px;line-height:1.6">' + esc(msg) + '</p><div class="actions"><button class="btn primary" data-act="box-cancel">확인</button></div>'); }
function closeBox(ok){
  var inp = document.getElementById('box-in'), v = inp ? inp.value : null, r = boxResolve; boxResolve = null;
  var host = document.getElementById('modal'); if (host) host.innerHTML = '';
  if (r) r(inp ? (ok ? v : null) : !!ok);
  if (editing) renderModal(); else if (infoOpen) renderInfo();
}
function checkPin(msg){
  if (!DB.pin) return Promise.resolve(true);
  return inputBox(msg || '비밀번호를 입력하세요.', '확인', '비밀번호').then(function(v){ if (v == null) return false; if (v !== DB.pin){ toast('비밀번호가 다릅니다'); return false; } return true; });
}
function setupPin(){
  return inputBox('수업 모드 비밀번호를 정해 주세요 (4자 이상). 수업 모드를 끌 때와 기록을 지울 때 씁니다.', '다음', '새 비밀번호').then(function(v){
    if (v == null) return false; v = v.trim(); if (v.length < 4){ toast('4자 이상으로 정해 주세요'); return false; }
    return inputBox('확인을 위해 한 번 더 입력해 주세요.', '저장', '비밀번호 확인').then(function(v2){
      if (v2 == null) return false; if (v2.trim() !== v){ toast('두 비밀번호가 다릅니다'); return false; }
      DB.pin = v; saveLocal(); toast('비밀번호를 저장했습니다'); return true;
    });
  });
}
function renderInfo(){
  var host = document.getElementById('modal'); if (!host) return;
  var mail = 'mailto:schoolparksc@sje.ai.kr?subject=' + encodeURIComponent('[스포츠 토너먼트 v' + APP_VER + '] 버그 제보 · 기능 제안');
  host.innerHTML = '<div class="scrim" data-act="info-close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="info-t"><div class="sheet-h"><div><h2 id="info-t">스포츠 토너먼트 v' + APP_VER + '</h2><div class="sub">만든 이 · 다정고 박성찬</div></div><button class="close" data-act="info-close" aria-label="닫기">×</button></div><div class="sheet-b">'
    + '<p style="margin:0">바이브 코딩으로 만든 체육 대회 도구예요. 반 대항 토너먼트를 종목별로 설정하면 부전승을 포함한 대진표, 일정, 추첨 화면, 경기 기록지, 순위를 자동으로 만들어 줍니다.</p>'
    + '<p class="sub" style="margin:0">모든 기록은 이 기기(브라우저)에만 저장되고 어디로도 보내지지 않아요. 자유롭게 쓰고, 자기 학교 대회에 맞게 고쳐 쓰셔도 됩니다.</p>'
    + '<div class="note"><b>버그 제보 · 추가 기능 제안</b><br><a href="' + mail + '">schoolparksc@sje.ai.kr</a><br><span class="sub" style="font-size:12.5px">어떤 화면에서 무엇을 눌렀는지 적어 주시면 빨리 고칠 수 있어요. 학생 이름 등 개인정보는 보내지 말아 주세요.</span></div>'
    + '<div class="actions"><button class="btn primary" data-act="info-close">닫기</button></div></div></div></div>';
}

/* ---------------- 이벤트 ---------------- */
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3000); }
function isNarrow(){ return !!(window.matchMedia && window.matchMedia('(max-width:640px)').matches); }
function evById(id){ return EV(id); }
function parseLines(v){ return String(v || '').split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean); }
function setTeams(e, names){
  names = names.slice(0, MAX_TEAMS);
  var old = e.teams, nt = names.map(function(n, i){ return { id: old[i] ? old[i].id : uid(), name: n }; });
  var countChanged = nt.length !== old.length;
  function apply(){
    e.teams = nt;
    if (countChanged){ state.draws[e.id] = { at:null, slots:{} }; }
    save(); render();
  }
  if (countChanged && hasResults(e)){ toast('경기 기록이 있어 팀 수는 바꿀 수 없습니다. 이름만 바꿔 주세요.'); render(); return; }
  if (countChanged && drawDone(e)) confirmBox('팀 수가 바뀌어 지금 추첨 결과가 지워집니다. 계속할까요?', '바꾸기').then(function(ok){ if (ok) apply(); else render(); });
  else apply();
}

app.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-tab],[data-open],[data-act]'); if (!t) return;
  if (t.dataset.tab){ ui.tab = t.dataset.tab; persistUi(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.open && !t.dataset.act){ openMatch(t.dataset.open); return; }
  var a = t.dataset.act, id = t.dataset.id, e = id ? (rawEV(id) || EV(id)) : null;
  switch (a){
    case 'scrim': if (ev.target === t){ editing = null; document.getElementById('modal').innerHTML = ''; } return;
    case 'close': editing = null; document.getElementById('modal').innerHTML = ''; return;
    case 'save-result': saveResult(); return;
    case 'clear-result': confirmBox('이 경기 기록을 지웁니다. 계속할까요?', '지우기').then(function(ok){ if (!ok) return; delete state.results[editing.ev + ':' + editing.id]; editing = null; save(); render(); toast('기록을 지웠습니다'); }); return;
    case 'box-ok': closeBox(true); return;
    case 'box-cancel': if (ev.target === t) closeBox(false); return;
    case 'info': infoOpen = true; renderInfo(); return;
    case 'info-close': if (ev.target === t){ infoOpen = false; document.getElementById('modal').innerHTML = ''; } return;
    case 'go-admin': ui.tab = 'admin'; if (!state.events.length) addEvent(); render(); return;
    case 'ev': ui.ev = t.dataset.v; persistUi(); render(); return;
    case 'sched': ui.sched = t.dataset.v; persistUi(); render(); return;
    case 'mview': ui.mview = t.dataset.v; persistUi(); render(); return;
    case 'bview': ui.bview = t.dataset.v; persistUi(); render(); return;
    case 'mround': ui.mround[ui.ev] = t.dataset.v; render(); return;
    case 'print': window.print(); return;
    case 'bracket-img': bracketImage(); return;
    case 'kiosk-on': (DB.pin ? Promise.resolve(true) : setupPin()).then(function(ok){ if (!ok) return; DB.kiosk = true; stageFor = null; if (ui.tab === 'admin') ui.tab = 'home'; saveLocal(); render(); toast('수업 모드를 켰습니다 · 보기만 할 수 있어요'); }); return;
    case 'kiosk-off': checkPin('수업 모드를 끄려면 비밀번호를 입력하세요.').then(function(ok){ if (!ok) return; DB.kiosk = false; saveLocal(); render(); toast('수업 모드를 껐습니다'); }); return;
    case 'sample':
      if (state.events.length) confirmBox('지금 대회를 지우고 예시 대회로 바꿉니다. 먼저 백업을 받아 두세요. 계속할까요?', '예시 불러오기').then(function(ok){ if (ok) makeSample(); });
      else makeSample(); return;
    case 'ev-add': addEvent(); save(); render(); return;
    case 'ev-open': ui.admEv = ui.admEv === id ? null : id; render(); return;
    case 'ev-del': confirmBox('‘' + e.name + '’ 종목과 그 경기 기록을 지웁니다. 계속할까요?', '삭제').then(function(ok){
      if (!ok) return;
      state.events = state.events.filter(function(x){ return x.id !== id; }); delete state.draws[id];
      Object.keys(state.results).forEach(function(k){ if (k.indexOf(id + ':') === 0 || k.indexOf(id + '~f:') === 0) delete state.results[k]; });
      Object.keys(state.moved).forEach(function(k){ if (k.indexOf(id + ':') === 0 || k.indexOf(id + '~f:') === 0) delete state.moved[k]; });
      save(); render(); }); return;
    case 'qf': var g = +document.getElementById('qf-g').value, n = +document.getElementById('qf-n').value;
      if (!(n >= 2)){ toast('반 수를 2 이상으로 넣어 주세요'); return; }
      var names = []; for (var i = 1; i <= Math.min(n, MAX_TEAMS); i++) names.push((g > 0 ? g + '학년 ' : '') + i + '반');
      setTeams(e, names); return;
    case 'games-preset': e.games = t.dataset.v.split('\n'); save(); render(); return;
    case 'date-add': var d1 = document.getElementById('dt-one').value; if (!d1) return; if (e.dates.indexOf(d1) < 0) e.dates.push(d1); e.dates.sort(); save(); render(); return;
    case 'date-del': e.dates = e.dates.filter(function(d){ return d !== t.dataset.v; }); save(); render(); return;
    case 'date-clear': e.dates = []; save(); render(); return;
    case 'date-range': var f = document.getElementById('dt-from').value, to = document.getElementById('dt-to').value;
      if (!f || !to || f > to){ toast('시작일과 종료일을 바르게 넣어 주세요'); return; }
      for (var d = f; d <= to; d = addDays(d, 1)){ var w = dObj(d).getDay(); if (w !== 0 && w !== 6 && e.dates.indexOf(d) < 0) e.dates.push(d); }
      e.dates.sort(); save(); render(); return;
    case 'stage-open': stageFor = id; drafts[id] = null; render(); return;
    case 'stage-close': if (drawing) return; stageFor = null; if (document.fullscreenElement) document.exitFullscreen(); render(); return;
    case 'stage-full': var st = document.getElementById('stage'); if (!document.fullscreenElement && st && st.requestFullscreen) st.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); return;
    case 'draw-run': runDraw(stageFor); return;
    case 'draw-cancel': drafts[stageFor] = null; render(); return;
    case 'draw-save': var oe = EV(stageFor); oe = oe.base || oe; state.draws[stageFor] = { at: new Date().toISOString(), slots: drafts[stageFor] }; drafts[stageFor] = null; save(); render(); toast(oe.name + ' 대진을 저장했습니다'); return;
    case 'draw-reset': confirmBox('‘' + e.name + '’ 추첨 결과를 지웁니다. 계속할까요?', '지우기').then(function(ok){ if (!ok) return; state.draws[id] = { at:null, slots:{} }; save(); render(); }); return;
    case 'notice-add': state.notices.push({ id: uid(), date: todayStr(), text: '' }); save(); render(); return;
    case 'notice-del': state.notices = state.notices.filter(function(n){ return n.id !== id; }); save(); render(); return;
    case 'ms-add': state.milestones.push({ id: uid(), d: todayStr(), t: '', title: '', where: '', note: '' }); save(); render(); return;
    case 'ms-del': state.milestones = state.milestones.filter(function(n){ return n.id !== id; }); save(); render(); return;
    case 'ref-auto': refAuto(); return;
    case 'ref-print': refPrint(); return;
    case 'ref-clear': confirmBox('모든 심판 배정을 지웁니다. 계속할까요?', '지우기').then(function(ok){ if (!ok) return; state.refs.assign = {}; save(); render(); }); return;
    case 'backup': doBackup(); return;
    case 'restore': var rf = document.getElementById('restoreFile'); rf.value = ''; rf.click(); return;
    case 'csv': exportCsv(); return;
    case 'pin': checkPin('지금 비밀번호를 입력하세요.').then(function(ok){ if (ok) setupPin().then(function(){ render(); }); }); return;
    case 'new': checkPin('새 대회를 시작하려면 비밀번호를 입력하세요.').then(function(ok){ if (!ok) return;
      confirmBox(state.sample ? '예시 대회를 지우고 빈 대회로 시작합니다. 관리 탭에서 종목과 팀을 넣으면 됩니다. 계속할까요?' : '지금 대회(종목·대진·결과·공지)를 모두 지우고 빈 대회로 시작합니다. 먼저 백업을 받아 두세요. 계속할까요?', '새로 시작').then(function(ok2){ if (!ok2) return; setState(blankState()); addEvent(); ui.tab = 'admin'; save(); render(); window.scrollTo(0, 0); toast('새 대회를 시작합니다 · 대회 이름과 종목을 넣어 주세요'); }); }); return;
    case 'wipe': checkPin('이 기기의 모든 기록을 지우려면 비밀번호를 입력하세요.').then(function(ok){ if (!ok) return;
      confirmBox('이 기기에 저장된 대회 기록과 비밀번호를 모두 지웁니다. 되돌릴 수 없습니다. 계속할까요?', '모두 지우기').then(function(ok2){ if (!ok2) return; try { localStorage.removeItem(LS); } catch(e){} location.hash = ''; location.reload(); }); }); return;
  }
});
app.addEventListener('keydown', function(ev){
  var t = ev.target;
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('g.node[data-open]')){ ev.preventDefault(); openMatch(t.dataset.open); }
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape'){
    if (boxResolve !== null || document.getElementById('box-in')) { closeBox(false); return; }
    if (editing){ editing = null; document.getElementById('modal').innerHTML = ''; return; }
    if (infoOpen){ infoOpen = false; document.getElementById('modal').innerHTML = ''; return; }
    if (stageFor && !drawing){ stageFor = null; render(); }
  }
  if (ev.key === 'Enter' && document.getElementById('box-in')){ closeBox(true); }
  if (ev.key === ' ' && stageFor && !drawing && !/INPUT|TEXTAREA|SELECT|BUTTON/.test((ev.target.tagName || ''))){ ev.preventDefault(); var b = document.querySelector('[data-act="draw-run"]'); if (b && !b.disabled) runDraw(stageFor); }
});
app.addEventListener('input', function(ev){
  var t = ev.target, a = t.dataset && t.dataset.act;
  if (a === 'score' && editing){ var v = t.value === '' ? null : Math.max(0, Math.round(+t.value)); editing.games[+t.dataset.i][+t.dataset.s] = isNum(v) ? v : null; editing.err = ''; refreshModalSummary(); }
  else if (a === 'note' && editing) editing.note = t.value;
});
app.addEventListener('change', function(ev){
  var t = ev.target, ds = t.dataset || {};
  if (t.id === 'restoreFile'){ if (t.files && t.files[0]) doRestore(t.files[0]); return; }
  if (editing){
    if (ds.act === 'forfeit'){ editing.forfeit = t.value; editing.err = ''; renderModal(); return; }
    if (ds.act === 'override'){ editing.override = t.value; refreshModalSummary(); return; }
    if (ds.act === 'ed-d'){ editing.d = t.value; return; }
    if (ds.act === 'ed-t'){ editing.t = t.value; return; }
    if (ds.act === 'ed-ref'){ editing.ref = t.value; return; }
  }
  if (ds.st){ state[ds.st] = t.value; save(); if (ds.st !== 'rules') render(); else { /* 규칙 탭 표시 갱신 */ render(); } return; }
  if (ds.ef){
    var e = rawEV(ui.admEv); if (!e) return;
    var f = ds.ef, v = t.value;
    if (f === 'teams'){ setTeams(e, parseLines(v)); return; }
    if (f === 'games'){ var gs = parseLines(v); if (!gs.length){ toast('세트를 하나 이상 넣어 주세요'); render(); return; } e.games = gs.slice(0, 15); }
    else if (f === 'split'){ if (hasResults(EV(e.id))){ toast('경기 기록이 있어 바꿀 수 없습니다'); render(); return; } e.split = t.checked; }
    else if (f === 'deuce') e.deuce = v === '1';
    else if (f === 'target') e.target = Math.max(0, Math.min(99, Math.round(+v) || 0));
    else if (f === 'perDay') e.perDay = Math.max(1, Math.min(20, Math.round(+v) || 1));
    else e[f] = v;
    save(); render(); return;
  }
  if (ds.nt){ var n = state.notices.filter(function(x){ return x.id === ds.id; })[0]; if (n){ n[ds.nt] = t.value; save(); } return; }
  if (ds.ms){ var m = state.milestones.filter(function(x){ return x.id === ds.id; })[0]; if (m){ m[ds.ms] = t.value; save(); } return; }
  if (ds.act === 'ref-on'){ state.refs.on = t.checked; save(); render(); return; }
  if (ds.act === 'ref-list'){
    var old = state.refs.list, names = parseLines(t.value);
    state.refs.list = names.map(function(nm, i){ var hit = old.filter(function(x){ return x.name === nm; })[0]; return hit || { id: uid(), name: nm }; });
    var keep = {}; state.refs.list.forEach(function(x){ keep[x.id] = 1; });
    Object.keys(state.refs.assign).forEach(function(k){ if (!keep[state.refs.assign[k]]) delete state.refs.assign[k]; });
    save(); render(); return;
  }
});
function addEvent(){
  var n = state.events.length + 1, e = { id: 'e' + uid(), name: '종목 ' + n, teams: [], games: ['1세트','2세트','3세트'], mode: 'set', target: 21, deuce: false, split: false, time: '12:35', perDay: 1, dates: [] };
  state.events.push(e); ui.admEv = e.id;
}
var _rsz; window.addEventListener('resize', function(){ var nw = isNarrow(); if (stageFor && !drawing){ clearTimeout(_rsz); _rsz = setTimeout(render, 150); return; } if (nw !== window.__nw){ window.__nw = nw; if (ui.tab === 'bracket' && !stageFor) render(); } });
window.__nw = isNarrow();

/* ---------------- 시작 ---------------- */
if (/kiosk/i.test(location.hash)) DB.kiosk = true;
render();
if (/unlock/i.test(location.hash)){
  confirmBox('수업 모드 비밀번호를 지우고 수업 모드를 끕니다. (비밀번호를 잊었을 때만 쓰세요) 계속할까요?', '지우기').then(function(ok){
    history.replaceState(null, '', location.pathname + location.search);
    if (!ok) return; DB.pin = ''; DB.kiosk = false; saveLocal(); render(); toast('비밀번호를 지웠습니다');
  });
}
})();
